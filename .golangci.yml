version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - errorlint
    - gocritic
    - misspell
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        - (*text/tabwriter.Writer).Flush
        - (*database/sql.DB).Close
        - (*os.File).Close
        - (*database/sql.Rows).Close
        - (*github.com/leue21/timeweft/internal/store.Store).Close
        - os.Remove # best-effort temp file cleanup
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/leue21/timeweft
